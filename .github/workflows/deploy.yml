name: Deploy PocketBase to Strato Server

on:
  push:
    branches:
      - main

# Zwei gleichzeitige Deploys wuerden sich beim Upload in die Quere kommen.
concurrency:
  group: deploy

env:
  # Muss dem WorkingDirectory der systemd-Unit entsprechen:
  #   systemctl show pocketbase -p WorkingDirectory
  TARGET: /var/www/mein-projekt

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # pb_public/ ist gitignored und entsteht erst hier.
      - name: Frontend bauen
        run: ./build.sh

      # Hochgeladen wird nach .deploy/, umgeschwenkt wird erst im letzten
      # Step. Scheitert der Upload, laeuft die App unveraendert weiter.
      - name: Staging-Ordner leeren
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          script: |
            set -e
            SUDO=""
            [ "$(id -u)" -ne 0 ] && SUDO="sudo"
            $SUDO rm -rf "${{ env.TARGET }}/.deploy"

      # Nur diese beiden Ordner. Das Binary wird bewusst nicht mitdeployt
      # (Linux-Release liegt einmalig auf dem Server), pb_data/ ist die
      # Datenbank. Kein `rm: true` -- das wuerde das Zielverzeichnis
      # inklusive pb_data/ vor dem Upload loeschen.
      - name: pb_public + Migrationen hochladen
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          source: "pb/pb_public/*,pb/pb_migrations/*"
          target: ${{ env.TARGET }}/.deploy
          strip_components: 1 # schneidet das fuehrende pb/ weg

      # Beim Start laufen die Migrationen aus pb_migrations/ automatisch gegen
      # die Produktions-DB -- deshalb vorher eine Kopie ziehen, und zwar bei
      # gestopptem Dienst (SQLite im WAL-Modus laesst sich sonst inkonsistent
      # kopieren). Es wird genau eine Sicherung vorgehalten.
      - name: Sichern, umschwenken, Service neu starten
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          command_timeout: 20m # cp -a einer grossen pb_data darf dauern
          script: |
            set -e
            T="${{ env.TARGET }}"

            # Funktioniert als root wie auch mit eigenem Service-User.
            SUDO=""
            [ "$(id -u)" -ne 0 ] && SUDO="sudo"

            # Vor dem Stoppen pruefen, ob ueberhaupt etwas zum Umschwenken da
            # ist -- sonst steht der Dienst gleich ohne Frontend da.
            for d in pb_public pb_migrations; do
              if [ ! -d "$T/.deploy/$d" ]; then
                echo "Upload unvollstaendig: $T/.deploy/$d fehlt."
                exit 1
              fi
            done

            # Was auch immer zwischen stop und start schiefgeht: der Dienst
            # darf nicht gestoppt zurueckbleiben.
            trap '$SUDO systemctl start pocketbase || true' EXIT

            $SUDO systemctl stop pocketbase

            # Beim allerersten Deploy gibt es noch keine Datenbank.
            # Erst neben die alte Sicherung kopieren, dann umbenennen -- sonst
            # gibt es ein Fenster ganz ohne gueltige Kopie.
            if [ -d "$T/pb_data" ]; then
              $SUDO rm -rf "$T/pb_data.new"
              $SUDO cp -a "$T/pb_data" "$T/pb_data.new"
              $SUDO rm -rf "$T/pb_data.bak"
              $SUDO mv "$T/pb_data.new" "$T/pb_data.bak"
            else
              echo "Noch keine Datenbank vorhanden -- erster Deploy, nichts zu sichern."
            fi

            # pb_public/ ist reiner Build-Output und wird ersetzt, damit sich
            # keine alten Hash-Assets ansammeln -- aber erst das neue rein,
            # dann das alte weg. pb_migrations/ wird nur ergaenzt: PocketBase
            # legt dort serverseitig eigene Migrationen ab.
            $SUDO rm -rf "$T/pb_public.old"
            if [ -d "$T/pb_public" ]; then
              $SUDO mv "$T/pb_public" "$T/pb_public.old"
            fi
            $SUDO mv "$T/.deploy/pb_public" "$T/pb_public"
            $SUDO rm -rf "$T/pb_public.old"

            $SUDO mkdir -p "$T/pb_migrations"
            $SUDO cp -a "$T/.deploy/pb_migrations/." "$T/pb_migrations/"
            $SUDO rm -rf "$T/.deploy"

            $SUDO systemctl start pocketbase

            # `systemctl is-active` meldet bei Type=simple schon "active",
            # bevor PocketBase ueberhaupt gebootet hat -- eine gescheiterte
            # Migration faellt damit nicht auf. Deshalb die API fragen.
            # -L folgt dem Redirect von Port 80 auf HTTPS, -k akzeptiert das
            # Domain-Zertifikat auf 127.0.0.1.
            for i in $(seq 1 10); do
              if curl -fsSLk http://127.0.0.1/api/health > /dev/null; then
                echo "PocketBase antwortet."
                exit 0
              fi
              sleep 2
            done

            echo "PocketBase antwortet nach 20s nicht:"
            $SUDO systemctl status pocketbase --no-pager || true
            exit 1
