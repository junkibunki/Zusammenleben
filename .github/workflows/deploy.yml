name: Deploy to Strato Server

# Die Pipeline startet automatisch bei jedem Push auf den Haupt-Branch (main)
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: it-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute SSH Commands on Strato
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            echo "Verbindung erfolgreich!"
            cd /var/www/mein-projekt || mkdir -p /var/www/mein-projekt && cd /var/www/mein-projekt
            echo "Hier können Sie jetzt git pull, docker-compose up oder npm install ausführen"
            uname -a
